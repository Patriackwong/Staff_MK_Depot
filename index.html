<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MK Time Ticker</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      background: #A8E6CF;
      font-family: 'Prompt', sans-serif;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      text-align: center;
    }
    .logo { max-width: 120px; border-radius: 16px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; color: #2E7D32; margin-bottom: 4px; }
    .hint { font-size: 14px; color: #555; margin: 12px 0 6px; }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,.08);
      padding: 20px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 8px;
    }
    button {
      border: none;
      border-radius: 50px;
      padding: 16px 0;
      width: 100%;
      font-size: 20px;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .btn-in  { background: #4CAF50; }
    .btn-out { background: #FF7043; }
    .warn { color: #D32F2F; font-size: 15px; font-weight: 600; margin: 16px 0; max-width: 360px; }
    .pdpa { font-size: 13px; color: #555; margin-top: 12px; max-width: 360px; }
    .pdpa a { color: #2E7D32; }
    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #666;
      min-height: 20px;
      max-width: 360px;
      white-space: pre-line;
    }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      align-items: center;
      justify-content: center;
    }
    .overlay.show { display: flex; }
    .overlay .box {
      background: #fff;
      border-radius: 20px;
      padding: 28px 36px;
      font-size: 17px;
      color: #2E7D32;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTytwug670ZT-11TYlXrUSICFqRsBv5_WCqmQ&s" alt="Logo">

  <h1>บันทึกเวลาการทำงานของพนักงานประจำคลังแม่กลอง</h1>

  <p class="hint">กดปุ่มด้านล่าง เพื่อบันทึกการลงเข้า</p>
  <div class="card">
    <button class="btn-in" id="btnIn" onclick="record('in')">Check-In</button>
  </div>

  <p class="hint">กดปุ่ม เพื่อบันทึกเวลาออก</p>
  <div class="card">
    <button class="btn-out" id="btnOut" onclick="record('out')">Check-Out</button>
  </div>

  <p class="warn">เมื่อเลิกงานแล้วอย่าลืม Check-Out เพื่อสิทธิประโยชน์ของผู้ทำงานเอง</p>

  <div class="pdpa">
    <label><input type="checkbox" id="pdpaConsent" checked> ฉันขออนุญาตให้เก็บข้อมูลตามข้อกำหนด PDPA</label><br>
    <a href="https://patriackwong.github.io/PTGMKDEPOTPDPA/" target="_blank">รายละเอียดนโยบายความเป็นส่วนตัว (Privacy Notice)</a>
  </div>

  <p id="status"></p>

  <div class="overlay" id="loading"><div class="box">กำลังบันทึกข้อมูล โปรดรอสักครู่...</div></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
  <script>
    // ===================== ตั้งค่า =====================
    const LIFF_ID  = '2008171590-o7DbGdZQ';   // LIFF เดิม ใช้ต่อได้เลย
    const FUNC_URL = 'https://YOUR-PROJECT-REF.supabase.co/functions/v1/attendance'; // 🔧 แก้เป็น URL โปรเจกต์ของคุณ
    // ===================================================

    const statusEl = document.getElementById('status');
    const loading  = document.getElementById('loading');

    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn() && !liff.isInClient()) liff.login();
      })
      .catch((err) => { statusEl.textContent = 'LIFF init ล้มเหลว: ' + err.message; });

    function setBusy(b) {
      loading.classList.toggle('show', b);
      document.getElementById('btnIn').disabled = b;
      document.getElementById('btnOut').disabled = b;
    }

    // ช่วงเวลาที่ถือว่า "เช้าเกินกว่าจะเลิกงาน" — ถ้ากด Check-Out ในช่วงนี้จะถามยืนยันก่อน
    const EARLY_OUT_START = 7;   // 07:00
    const EARLY_OUT_END   = 12;  // 12:00 (เที่ยง)

    function record(ctype) {
      if (!document.getElementById('pdpaConsent').checked) {
        alert('กรุณายอมรับเงื่อนไข PDPA ก่อน');
        return;
      }

      // กันกด Check-Out ผิดตอนเช้า (เช่นตั้งใจจะเข้างานแต่กดปุ่มขวา)
      if (ctype === 'out') {
        const nowBkk = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Bangkok' }));
        const h = nowBkk.getHours();
        if (h >= EARLY_OUT_START && h < EARLY_OUT_END) {
          const hhmm = nowBkk.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
          const ok = confirm(
            'ยืนยันการเลิกงาน (Check-Out)?\n\n' +
            'ขณะนี้เวลา ' + hhmm + ' ซึ่งยังเป็นช่วงเช้า\n' +
            'หากคุณเพิ่งมาถึงและตั้งใจจะ "เข้างาน" กรุณากดยกเลิก แล้วกดปุ่ม Check-In สีเขียวแทน\n\n' +
            'กด "ตกลง" เฉพาะเมื่อคุณต้องการเลิกงานจริงๆ เท่านั้น'
          );
          if (!ok) {
            statusEl.textContent = 'ยกเลิกการเช็คเอาท์แล้ว — หากต้องการเข้างาน กรุณากดปุ่ม Check-In สีเขียว';
            return;
          }
        }
      }

      if (!navigator.geolocation) {
        statusEl.textContent = 'อุปกรณ์นี้ไม่รองรับ Geolocation';
        return;
      }
      setBusy(true);
      navigator.geolocation.getCurrentPosition(
        (pos) => send(ctype, pos.coords.latitude, pos.coords.longitude),
        (err) => {
          setBusy(false);
          statusEl.textContent = 'อ่านพิกัดไม่สำเร็จ: ' + err.message + '\nกรุณาเปิดอนุญาต Location แล้วลองใหม่';
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }

    async function send(ctype, lat, lng) {
      try {
        const accessToken = liff.getAccessToken();
        if (!accessToken) throw new Error('ไม่พบ token กรุณาเปิดผ่าน LINE');

        const res = await fetch(FUNC_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ctype, accessToken, lat, lng, os: liff.getOS() })
        });
        const raw = await res.text();
        let data;
        try {
          data = JSON.parse(raw);
        } catch (e) {
          throw new Error('เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ (HTTP ' + res.status + ')\n' +
            'คำตอบที่ได้: ' + raw.slice(0, 150) + '\n' +
            'มักเกิดจาก FUNC_URL หรือชื่อ function ไม่ถูกต้อง');
        }
        setBusy(false);
        alert(data.desc);
        if (data.ok && liff.isInClient()) liff.closeWindow();
      } catch (err) {
        setBusy(false);
        statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      }
    }
  </script>
</body>
</html>
